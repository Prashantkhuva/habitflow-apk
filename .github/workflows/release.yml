name: Create release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f HabitFlow.apk || { echo "HabitFlow.apk missing at tag"; exit 1; }
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" HabitFlow.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" HabitFlow.apk \
              --title "HabitFlow $GITHUB_REF_NAME" \
              --notes-from-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
